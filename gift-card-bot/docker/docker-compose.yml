version: "3.9"

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gift-card-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"  # Only expose locally behind reverse proxy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY}
      - DATABASE_URL=sqlite+aiosqlite:///data/gift_cards.db
      - ADMIN_IDS=${ADMIN_IDS}
      - PROVIDER_TOKEN=${PROVIDER_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET_TOKEN=${WEBHOOK_SECRET_TOKEN}
      - WEBHOOK_PORT=8443
      - WEBHOOK_LISTEN=0.0.0.0
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data    # Persist SQLite database
      - ../webapp:/app/webapp  # Optionally serve webapp static files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: reverse proxy for webhook + static file serving
  # nginx:
