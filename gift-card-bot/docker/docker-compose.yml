  #   container_name: gift-card-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #     - ../webapp:/usr/share/nginx/html/webapp
  #     # SSL certs (mount or use certbot)
  #   depends_on:
  #     - bot