# Reverse proxy for webhook + static webapp hosting
upstream bot_backend {
    server bot:8443;
}

server {
    listen 80;
    server_name bot.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bot.your-domain.com;

    ssl_certificate /etc/letsencrypt/live/bot.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.your-domain.com/privkey.pem;

    # Serve WebApp static files
    location /webapp/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /webapp/index.html;
    }

    # Webhook endpoint — proxy to bot
    location /webhook {
        proxy_pass http://bot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://bot_backend;
    }
}